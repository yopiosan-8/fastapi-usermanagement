name: ci

on:
  pull_request:
    branches:
      - main

env:
  SECRET_KEY: "test-secret-key"
  SQLALCHEMY_DATABASE_URL: "sqlite:///./test.db"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/test_user.py