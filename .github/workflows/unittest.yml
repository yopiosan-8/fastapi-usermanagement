name: Unit Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "308e916077ae69bee900c19348c150e20f2dca5d870cd26bdd527a5291e41ec4"
      SQLALCHEMY_DATABASE_URL: "postgresql://fastapiuser:fastapipass@watanabe-user-management.cuf82id02mnx.ap-northeast-1.rds.amazonaws.com:5432/usermanagement"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/test_user.py