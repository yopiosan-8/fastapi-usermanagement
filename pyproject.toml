[project]
name = "fastapi-usermanagement"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2[binary]",
    "python-jose[cryptography]",
    "python-multipart",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2",
    "ruff",
]